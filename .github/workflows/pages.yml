name: Deploy INEO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily refresh at 07:25 UTC (04:25 in São Paulo), including when source is unchanged.
    - cron: '25 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate bilingual site and content
        run: |
          node --check app.js
          node --check history.js
          node --check gallery.js
          node --check scripts/sync-openalex.mjs
          node scripts/validate.mjs
          node scripts/test-openalex.mjs

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp ./*.html ./*.css ./*.js dist/
          cp -R assets content dist/
          touch dist/.nojekyll

      - name: Refresh OpenAlex publication catalogue
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/sync-openalex.mjs --output dist/content/openalex.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # GitHub's artifact listing may lag behind a completed upload.
      - name: Allow Pages artifact registration
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
